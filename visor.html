<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor Raíces Vivas</title>
<style>
html,body{margin:0;height:100%;font-family:Arial}
#pdf{width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="pdf" title="Lectura PDF"></iframe>
<script>
const p = new URLSearchParams(location.search);
const archivo = p.get("archivo");
if (archivo) {
 document.getElementById("pdf").src =
 encodeURI(archivo) + "#view=Fit";
}
</script>
</body>
</html>
